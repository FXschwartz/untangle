name: Bug report
description: Tell us what went wrong in untangle.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: picture
    attributes:
      label: Picture
      description: Paste the picture untangle copied, or drop one here.
  - type: textarea
    id: details
    attributes:
      label: What untangle adds
      description: Filled in by untangle's Feedback button. Take out anything you'd rather not share.
