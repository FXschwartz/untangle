<html lang="en">
<head>

<style>
/* Layout: a reading column (~68ch) for the argument; the working prototype breaks out to the full 1280px width and behaves like an editor pane. Deliberately dark-only: near-black and greys, with color reserved for code and review state. */
:root {
  --paper: #09090B;
  --surface: #111113;
  --surface-2: #18181B;
  --surface-3: #222226;
  --ink: #EDEDEF;
  --ink-2: #B4B4BA;
  --ink-3: #85858D;
  --line: #242428;
  --line-2: #36363C;
  --accent: #EDEDEF;
  --accent-ink: #EDEDEF;
  --on-accent: #09090B;
  --mark: #3A2C08;
  --mark-ink: #F2C14E;
  --mark-strong: #D6A03A;
  --fold: #3DB58C;
  --fold-bg: #0F2A21;
  --fold-ink: #7FD9B6;
  --add-bg: #0E2216;
  --add-strong: #1F5233;
  --add-ink: #7EE2A0;
  --del-bg: #2A0F12;
  --del-strong: #6B2329;
  --del-ink: #FF9B95;
  --rev-bg: #123329;
  --hunk-bg: #151518;
  --mv-bg: #17162A;
  --mv-line: #2C2950;
  --mv-ink: #B9A8FF;
  --syn-kw: #C586C0;
  --syn-ty: #4EC9B0;
  --syn-str: #CE9178;
  --syn-num: #B5CEA8;
  --syn-com: #6A9955;
  --syn-ann: #DCDCAA;
  --syn-fn: #DCDCAA;
  --syn-id: #9CDCFE;
  --syn-op: #CCCCCC;
  --shadow: 0 1px 0 rgba(0, 0, 0, .4), 0 24px 48px -28px rgba(0, 0, 0, .9);
  --font-display: "Schibsted Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Schibsted Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 400 16px/1.6 var(--font-body); -webkit-font-smoothing: antialiased; }
p { margin: 0; }
a { color: var(--ink); text-decoration-color: var(--ink-3); text-underline-offset: 3px; }
code, .mono { font-family: var(--font-mono); font-size: .86em; }
.muted { color: var(--ink-3); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }



.btn { appearance: none; font: 600 13px/1 var(--font-body); padding: 8px 12px; border-radius: 7px; cursor: pointer; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.sm { font-size: 12.5px; padding: 6px 10px; }
.btn.xs { font-size: 11.5px; padding: 4px 8px; }
.linkish { appearance: none; border: 0; background: none; padding: 0; color: var(--ink); text-decoration-color: var(--ink-3); font: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; text-align: left; }
.chip-btn { appearance: none; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font: 500 11.5px/1.2 var(--font-mono); padding: 4px 8px; border-radius: 999px; cursor: pointer; }
.chip-btn:hover { border-color: var(--ink-2); }
.chip-btn.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.dstat { display: inline-flex; gap: 6px; align-items: center; font: 600 11.5px/1 var(--font-mono); }
.dstat .sq { display: inline-flex; gap: 2px; }
.dstat .sq i { width: 8px; height: 8px; border-radius: 1px; display: inline-block; }
.dstat .sa { background: var(--add-ink); } .dstat .sd { background: var(--del-ink); }
.focus-bar { position: sticky; left: 0; top: 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: 13px; color: var(--ink-2); }
.focus-bar .sp { flex: 1; }
.fv-sub.hier { gap: 6px 8px; }
.map-link { font-size: 12px; margin-left: 4px; }
.sb-row.map .st { background: var(--ink); border-color: var(--ink); border-radius: 50%; }
.graph-scroll.tall { max-height: 640px; }
.hh-done .hh-tx { color: var(--fold-ink); }

/* Viewer */
.vw { background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); height: min(900px, 92vh); }
.vw-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 10px 14px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.vw-title { font: 500 13px/1.35 var(--font-mono); color: var(--ink-2); min-width: 0; flex: 1 1 220px; }
.vw-title b { color: var(--ink); }
.mini-seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; background: var(--surface); }
.mini-seg button { appearance: none; border: 0; background: transparent; color: var(--ink-2); font: 600 12px/1 var(--font-mono); padding: 7px 10px; cursor: pointer; white-space: nowrap; }
.mini-seg button + button { border-left: 1px solid var(--line-2); }
.mini-seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.mini-seg button { font-size: 11px; padding: 5px 8px; }
.check { display: inline-flex; gap: 6px; align-items: center; font: 500 12px/1.2 var(--font-mono); color: var(--ink-2); cursor: pointer; }
.vw-search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; padding: 0 10px; min-width: min(220px, 100%); flex: 0 1 260px; }
.vw-search svg { color: var(--ink-3); flex: none; }
.vw-search input { appearance: none; border: 0; background: transparent; color: var(--ink); font: 400 13px/1 var(--font-mono); padding: 8px 0; width: 100%; outline: none; }
.vw-body { display: grid; grid-template-columns: 320px minmax(0, 1fr); min-height: 0; }
.vw-side { position: relative; border-right: 1px solid var(--line); background: var(--surface-2); overflow-y: auto; padding: 12px 8px 24px; display: grid; gap: 2px; align-content: start; }
.vw-main { overflow: auto; min-width: 0; position: relative; background: var(--surface); }

.sb-prog { padding: 4px 8px 12px; display: grid; gap: 6px; }
.sb-big { font-size: 14.5px; } .sb-big b { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.sb-sub { font: 500 12px/1.4 var(--font-mono); color: var(--ink-3); }
.track { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.fill { height: 100%; background: var(--fold); border-radius: 3px; transition: width .25s ease; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; margin: 0 4px 6px; background: var(--surface-3); border-radius: 9px; }
.tabs button { appearance: none; border: 0; background: transparent; color: var(--ink-2); font: 600 12.5px/1 var(--font-body); padding: 8px; border-radius: 6px; cursor: pointer; }
.tabs button span { font-family: var(--font-mono); font-weight: 500; color: var(--ink-3); margin-left: 4px; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .4); }
.sb-h { display: flex; justify-content: space-between; gap: 8px; font: 600 10.5px/1.3 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); padding: 14px 8px 6px; }
.sb-hn { letter-spacing: 0; text-transform: none; font-weight: 500; }
.sb-row { appearance: none; border: 0; background: transparent; color: inherit; text-align: left; width: 100%; display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 6px 8px; border-radius: 6px; cursor: pointer; font: inherit; }
.sb-row:hover { background: var(--surface-3); }
.sb-row[aria-current="true"] { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-2); }
.sb-row .st { width: 10px; height: 10px; border-radius: 3px; background: var(--mark); border: 1.5px solid var(--mark-strong); align-self: start; margin-top: 4px; }
.sb-row.done .st { background: var(--fold); border-color: var(--fold); }
.sb-row.gen .st { border-radius: 50%; background: var(--surface); border: 1.5px dashed var(--line-2); }
.sb-row .nm { font: 600 12.5px/1.4 var(--font-mono); overflow-wrap: anywhere; color: var(--ink); }
.sb-row.done .nm { color: var(--ink-3); }
.sb-row .sub { display: block; font: 400 11px/1.4 var(--font-mono); color: var(--ink-3); }
.sb-row .cnt { font: 500 11px/1.4 var(--font-mono); color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mini-track { display: block; height: 3px; border-radius: 2px; background: var(--surface-3); margin-top: 5px; overflow: hidden; }
.mini-track span { display: block; height: 100%; background: var(--fold); }
.a { color: var(--add-ink); } .d { color: var(--del-ink); }

.fv-head { position: sticky; top: 0; left: 0; z-index: 4; background: var(--surface); border-bottom: 1px solid var(--line); padding: 12px 16px 10px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
.fv-title { font: 400 14px/1.4 var(--font-mono); color: var(--ink); overflow-wrap: anywhere; }
.fv-title b { font-weight: 700; font-size: 15px; }
.fv-dir { color: var(--ink-3); font-size: 12.5px; }
.fv-sub { font-size: 12.5px; color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.fv-sub code { font-size: 11.5px; background: var(--surface-3); padding: .05em .35em; border-radius: 4px; }
.fv-sub .chip-btn { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fv-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font: 500 12px/1.4 var(--font-mono); color: var(--ink-3); }
.fv-meta .sp, .pk-h .sp, .sec-m .sp { flex: 1; }
.since-note, .gen-note { margin: 10px 16px 0; padding: 9px 12px; border-radius: 8px; background: var(--fold-bg); color: var(--fold-ink); font-size: 13px; position: sticky; left: 16px; max-width: 760px; }
.gen-note { margin: 4px 0 0; background: var(--surface-2); color: var(--ink-2); position: static; }
.since-note code { background: transparent; padding: 0; }

.graph-box { position: sticky; left: 0; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); background: var(--surface); display: grid; gap: 8px; }
.graph-scroll { overflow: auto; max-height: 420px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); }
.graph { display: block; color: var(--ink-3); }
.g-node { cursor: pointer; }
.g-box { fill: var(--surface); stroke: var(--line-2); stroke-width: 1.2; }
.g-node.root .g-box { stroke: var(--ink); stroke-width: 1.8; }
.g-node.focus .g-box { stroke: var(--ink); stroke-width: 2.6; fill: var(--surface-3); }
.g-node.dim, .g-edge.dim { opacity: .28; }
.g-edge.long { opacity: .22; }
.g-edge.share { stroke-dasharray: 5 4; }
.g-node.grp .g-box { stroke-dasharray: 5 3; }
.g-bar { fill: var(--mark-strong); }
.g-node.ok .g-bar { fill: var(--fold); }
.g-node:hover .g-box, .g-node:focus-visible .g-box { stroke: var(--ink); stroke-width: 2; }
.g-node:focus-visible { outline: none; }
.g-l1 { fill: var(--ink-3); font: 500 10.5px var(--font-mono); }
.g-l2 { fill: var(--ink); font: 700 12.5px var(--font-mono); }
.g-node.ok .g-l2 { fill: var(--ink-3); }
.g-cnt { fill: var(--ink-3); font: 600 10.5px var(--font-mono); }
.g-edge { fill: none; stroke: var(--ink-3); stroke-width: 1.3; }
.g-elabel { fill: var(--ink-2); font: 500 10.5px var(--font-mono); paint-order: stroke; stroke: var(--paper); stroke-width: 4px; stroke-linejoin: round; }
.g-more { cursor: pointer; }
.g-more rect { fill: var(--surface-2); stroke: var(--line-2); stroke-dasharray: 4 3; }
.g-more text { fill: var(--accent-ink); font: 600 12px var(--font-mono); }
.graph-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--ink-3); }
.graph-legend span { display: inline-flex; gap: 6px; align-items: center; }
.graph-legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.lg-open { background: var(--mark-strong); } .lg-ok { background: var(--fold); }
.graph-legend i.lg-share { width: 18px; height: 0; border-radius: 0; border-top: 1.5px dashed var(--ink-3); }
.links { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.links-k { font: 600 10.5px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-right: 4px; }

.sec { padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.sec-h { position: sticky; left: 0; padding: 14px 16px 6px; display: grid; gap: 4px; max-width: 100%; }
.sec-t { font: 400 12.5px/1.4 var(--font-mono); color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.sec-t b { font-size: 14px; color: var(--ink); }
.root-pill { font: 600 10px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .06em; background: var(--ink); color: var(--paper); padding: 3px 6px; border-radius: 4px; }
.sec-m { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 12.5px; color: var(--ink-3); }
.sec-m code { font-size: 11.5px; background: var(--surface-3); padding: .05em .3em; border-radius: 3px; }
.sec-note { padding: 0 16px 4px; font-size: 12.5px; color: var(--ink-3); position: sticky; left: 0; }
.sec-file, .inst-file { padding: 10px 16px 4px; font: 500 12px/1.4 var(--font-mono); position: sticky; left: 0; }
.inst-gap { height: 8px; }
.ln.skip { color: var(--ink-3); font-size: 11.5px; background: var(--surface-2); }
.ln.skip .tx { font-family: var(--font-body); padding: 1px 0; }
.more-row { padding: 6px 16px 12px; position: sticky; left: 0; }
.ctx-row { font-size: 13px; padding-top: 2px; }
.ctx-row .muted { margin-left: 2px; }
.sec-h.sub { padding: 10px 16px 2px; border-top: 1px dashed var(--line); }
.sec-h.sub .sec-t span { color: var(--ink-2); font-size: 13px; }
.sym-h { position: sticky; left: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 12px 16px 4px; border-top: 1px solid var(--line); font-size: 13px; }
.sym-h .sp { flex: 1; }
.sec .sec-t .dstat { margin-left: 6px; }
.flash-sec .sec-h { animation: flashsec 1.6s ease-out 1; }
@keyframes flashsec { 0% { background: rgba(255, 255, 255, .08); } 100% { background: transparent; } }

.code { font: 400 12.5px/1.65 var(--font-mono); width: max-content; min-width: 100%; }
.ln { display: flex; align-items: flex-start; }
/* A whole file has thousands of rows: the ones off screen skip layout and paint until scrolled to. */
.code > .ln, .code > .sl { content-visibility: auto; contain-intrinsic-size: auto 20.625px; }
/* That clips what overflows a row, so focus rings inside rows are drawn inward. */
.code > .ln :focus-visible, .code > .sl :focus-visible, .vw-side .sb-row.tr:focus-visible { outline-offset: -2px; }
.ln .g, .sl .g { width: 30px; flex: none; display: flex; justify-content: center; position: sticky; left: 0; z-index: 1; background: inherit; }
.ln .no { width: 46px; flex: none; text-align: right; padding-right: 8px; color: var(--ink-3); user-select: none; font-variant-numeric: tabular-nums; }
.ln .no.wide { width: 60px; }
.ln .sg { width: 18px; flex: none; text-align: center; color: var(--ink-3); user-select: none; }
.ln .tx { white-space: pre; flex: none; padding-right: 14px; }
.bdgs { display: inline-flex; gap: 6px; flex: none; padding-right: 16px; align-self: center; }
.ln.ctx { background: var(--surface); }
.ln.add, .half.add { background: var(--add-bg); }
.ln.mv { background: var(--mv-bg); }
.ln.mv .sg { color: var(--mv-ink); }
.ln.mv-head, .ln.mv-away { background: var(--mv-bg); border-top: 1px solid var(--mv-line); }
.ln.mv-head .sg, .ln.mv-away .sg { color: var(--mv-ink); }
.ln.mv-head .tx, .ln.mv-away .tx { font-family: var(--font-body); font-size: 13px; color: var(--ink-2); }
.ln.skip.mv .tx { color: var(--mv-ink); }
.ln.del, .half.del { background: var(--del-bg); }
.ln.add .sg, .half.add .sg { color: var(--add-ink); } .ln.del .sg, .half.del .sg { color: var(--del-ink); }
.add .ch { background: var(--add-strong); border-radius: 2px; }
.del .ch { background: var(--del-strong); border-radius: 2px; }
.rv { background: var(--rev-bg); border-radius: 2px; text-decoration: underline dotted var(--fold); text-underline-offset: 3px; }
.ln.rvd, .sl.rvd { opacity: .6; }
.ln.rvd-quiet, .sl.rvd-quiet { opacity: .62; background: var(--surface); box-shadow: inset 3px 0 0 var(--fold); }
.ln.gone, .sl.gone { background: var(--surface); color: var(--fold-ink); font-size: 12px; box-shadow: inset 3px 0 0 var(--fold); opacity: .8; align-items: center; }
.ln.other, .sl.other { box-shadow: inset 3px 0 0 var(--line-2); }
.ln.gen .g { width: 8px; }
.ln.flash, .sl.flash { animation: flash 1.6s ease-out 1; }
@keyframes flash { 0% { box-shadow: inset 4px 0 0 var(--accent); filter: brightness(.94); } 100% { box-shadow: inset 4px 0 0 transparent; } }
.hh { display: flex; align-items: center; gap: 10px; background: var(--hunk-bg); color: var(--ink-3); padding: 2px 16px 2px 0; border-block: 1px solid var(--line); margin-top: 8px; min-height: 30px; }
.hh-tx { white-space: pre; margin-left: 8px; } .hh-ctx { color: var(--ink-2); }
.hh-note { font: 500 11.5px/1 var(--font-body); color: var(--ink-3); }
/* The band's gutter lines up with the rows': the fold toggle over the ticks, the expand icons over the line numbers. */
.hh-gut { display: flex; align-items: center; flex: none; width: 122px; position: sticky; left: 0; z-index: 1; background: inherit; }
.hh-g { width: 30px; flex: none; display: flex; justify-content: center; }
.hh-x { flex: 1; display: flex; justify-content: flex-end; gap: 2px; padding-right: 2px; }
.hh.joined { margin-top: 0; }
.hh.more { cursor: pointer; }
.hh.more:hover { background: var(--surface-3); color: var(--ink-2); }
.hh.more:hover .hh-x .ib { color: var(--ink); }
.hh-tail .hh-tx { font: 500 12px/1 var(--font-body); }
.chev { appearance: none; border: 0; background: none; color: var(--ink-2); width: 22px; height: 22px; border-radius: 4px; cursor: pointer; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
.chev:hover { background: var(--surface-3); }
.tick { appearance: none; width: 20px; height: 20px; margin-top: 1px; border-radius: 5px; border: 1.5px solid var(--mark-strong); background: var(--mark); color: transparent; font: 700 12px/1 var(--font-body); cursor: pointer; padding: 0; }
.tick:hover { color: var(--mark-ink); }
.tick.on { background: var(--fold); border-color: var(--fold); color: var(--paper); }
.dt { appearance: none; border: 1px solid var(--fold); background: var(--surface); color: var(--fold-ink); font: 600 10.5px/1 var(--font-mono); padding: 3px 7px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.bdg { appearance: none; font: 600 10.5px/1 var(--font-mono); padding: 3px 7px; border-radius: 999px; cursor: pointer; border: 1px solid var(--mark-strong); background: var(--surface); color: var(--mark-ink); white-space: nowrap; }
.bdg.ok { border-color: var(--fold); color: var(--fold-ink); }
.bdg.use { border-color: var(--ink-3); color: var(--ink); }
.t-kw { color: var(--syn-kw); } .t-ty { color: var(--syn-ty); } .t-str { color: var(--syn-str); } .t-num { color: var(--syn-num); }
.t-com { color: var(--syn-com); font-style: italic; } .t-ann { color: var(--syn-ann); } .t-op { color: var(--syn-op); } .t-key { color: var(--syn-id); }
.t-id { color: var(--syn-id); } .t-fn { color: var(--syn-fn); } .t-md { color: var(--ink); }
.ref { cursor: pointer; border-radius: 2px; }
.ref:hover { text-decoration: underline; text-decoration-color: var(--ink); text-underline-offset: 3px; background: rgba(255, 255, 255, .08); }

/* Split layout */
.vw.split .code { width: 100%; }
.sl { display: flex; align-items: stretch; }
.half { flex: 1 1 0; min-width: 0; display: flex; align-items: flex-start; }
.half.l { border-right: 1px solid var(--line); }
.half .no { width: 46px; flex: none; text-align: right; padding-right: 8px; color: var(--ink-3); user-select: none; }
.half .sg { width: 16px; flex: none; text-align: center; color: var(--ink-3); }
.half .tx { white-space: pre-wrap; word-break: break-all; flex: 1 1 auto; min-width: 0; padding-right: 10px; }
.half.empty { background: repeating-linear-gradient(135deg, var(--surface-2) 0 6px, var(--surface) 6px 12px); }
.half.ctx { background: var(--surface); }

.peek { position: sticky; left: 30px; width: min(860px, calc(100vw - 120px)); margin: 4px 0 10px 30px; border: 1.5px solid var(--line-2); border-radius: 9px; background: var(--surface); box-shadow: var(--shadow); overflow: hidden; font-family: var(--font-body); white-space: normal; z-index: 2; }
.pk-h { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 8px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: 13px; }
.pk-h2 { border-top: 1px solid var(--line); }
.pk-loc { font: 500 12px/1.4 var(--font-mono); color: var(--ink-2); overflow-wrap: anywhere; }
.pk-src { font: 600 10.5px/1 var(--font-mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; }
.pk-x { appearance: none; border: 0; background: none; color: var(--ink-3); cursor: pointer; font: 600 12px/1 var(--font-body); }
.pk-code { font: 400 12px/1.6 var(--font-mono); padding: 6px 0; overflow-x: auto; }
.pk-ln { display: flex; white-space: pre; }
.pk-ln .no { width: 46px; flex: none; text-align: right; padding-right: 10px; color: var(--ink-3); }
.pk-ln.hit { background: rgba(255, 255, 255, .07); box-shadow: inset 3px 0 0 var(--mark-ink); }
.pk-ln.add { background: var(--add-bg); }
.pk-ln.add.hit { background: linear-gradient(rgba(255, 255, 255, .06), rgba(255, 255, 255, .06)), var(--add-bg); }
.pk-ln .sg { width: 14px; flex: none; color: var(--add-ink); }
.pk-hint { font-size: 12px; color: var(--ink-3); }
.pk-foot { padding: 6px 12px 10px; font-size: 13px; }
.pk-list { display: grid; max-height: 240px; overflow-y: auto; padding: 4px 0; }
.pk-use { appearance: none; border: 0; background: none; text-align: left; display: grid; grid-template-columns: minmax(150px, 230px) minmax(0, 1fr); gap: 12px; padding: 4px 12px; cursor: pointer; font: 400 12px/1.5 var(--font-mono); color: var(--ink); }
.pk-use:hover { background: var(--surface-2); }
.pk-use[aria-current="true"] { background: var(--surface-3); box-shadow: inset 3px 0 0 var(--mark-ink); }
.pk-use[aria-current="true"] .pk-up::after { content: " →"; color: var(--mark-ink); }
.pk-use .pk-up { color: var(--accent-ink); overflow-wrap: anywhere; }
.pk-use code { white-space: pre; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
.pk-use.done { opacity: .55; }
.pk-use.done .pk-up::before { content: "✓ "; color: var(--fold); }
.empty { padding: 28px 16px; color: var(--ink-3); font-size: 14px; position: sticky; left: 0; max-width: 700px; }
mark { background: var(--mark); color: var(--mark-ink); border-radius: 2px; }

@media (max-width: 960px) {
  .vw { height: auto; }
  .vw-body { grid-template-columns: minmax(0, 1fr); }
  .vw-side { border-right: 0; border-bottom: 1px solid var(--line); max-height: 340px; }
  .vw-main { max-height: 80vh; }
  .peek { width: calc(100vw - 80px); }
  .graph-scroll { max-height: 300px; }
}

/* Whole files, the editor, search over the repository, the snapshot branch. */
a.btn { text-decoration: none; display: inline-block; }
.gen-tag { font: 600 10px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); border: 1px solid var(--line-2); border-radius: 4px; padding: 2px 5px; margin-left: 6px; }
.sb-snap { margin-top: 6px; font: 500 11px/1.45 var(--font-mono); color: var(--ink-3); overflow-wrap: anywhere; }
.sb-snap code { color: var(--ink-2); }
.code.src .ln.add .sg, .code.src .ln.del .sg { font-weight: 700; }
.inst-file .linkish { font: inherit; }

/* A view's tools: icon buttons, as VS Code's editor title bar has them. */
.tools { display: inline-flex; align-items: center; gap: 2px; }
.ib { appearance: none; display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 24px; padding: 0; border: 1px solid transparent; border-radius: 5px; background: transparent; color: var(--ink-2); cursor: pointer; text-decoration: none; flex: none; }
.ib:hover { background: var(--surface-3); color: var(--ink); }
.ib[aria-pressed="true"] { background: var(--surface-3); border-color: var(--line-2); color: var(--ink); }
.ib svg { display: block; }
.hh .ib { width: 24px; height: 22px; }

/* The Files tab's tree. */
.sb-row.tr { position: relative; padding: 3px 8px 3px calc(8px + var(--d, 0) * 14px); align-items: center; }
.sb-row.tr .st { margin-top: 0; align-self: center; }
.sb-row.dir .tw { width: 12px; height: 16px; display: flex; align-items: center; justify-content: center; color: var(--ink-3); }
.sb-row.dir .tw svg { flex: none; }
.sb-row.tr .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-row.dir .nm { font-weight: 500; color: var(--ink-2); }
.sb-row.dir.done .nm { color: var(--ink-3); }
.ig { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line-2); pointer-events: none; }
/* One line each, so a long tree can skip the rows off screen. */
.vw-side .sb-row.tr { content-visibility: auto; contain-intrinsic-size: auto 23.5px; }

/* GitHub's conversation: threads under their lines, writing comments, the Comments tab, the review. */
:root { --gh-blue: #4493F8; --gh-blue-bg: #1F6FEB; --gh-blue-soft: rgba(68, 147, 248, .14); }
.cm-add { position: absolute; z-index: 3; display: none; align-items: center; justify-content: center; width: 20px; height: 20px; padding: 0; border: 0; border-radius: 6px; background: var(--gh-blue-bg); color: #fff; font: 700 15px/1 var(--font-body); cursor: pointer; box-shadow: 0 1px 4px rgba(0, 0, 0, .5); }
.cm-add.on { display: inline-flex; }
.cm-add:hover { transform: scale(1.12); }
.ln.cm-sel, .sl.cm-sel, .ln.cm-drag, .sl.cm-drag { background-image: linear-gradient(var(--gh-blue-soft), var(--gh-blue-soft)); box-shadow: inset 3px 0 0 var(--gh-blue); }
body.dragging, body.dragging * { user-select: none; cursor: grabbing; }
.th { position: sticky; left: 30px; z-index: 2; width: min(860px, calc(100vw - 120px)); margin: 6px 0 10px 30px; border: 1px solid var(--line-2); border-radius: 9px; background: var(--surface); font-family: var(--font-body); white-space: normal; overflow: hidden; }
.th.new { border-color: var(--gh-blue); }
.th.flash-th { animation: flashth 1.6s ease-out 1; }
@keyframes flashth { 0% { box-shadow: 0 0 0 2px var(--gh-blue); } 100% { box-shadow: 0 0 0 2px transparent; } }
.th-fold { appearance: none; display: flex; align-items: center; gap: 6px; width: 100%; padding: 7px 12px; border: 0; background: var(--surface-2); color: var(--ink-2); font: 500 13px/1.3 var(--font-body); text-align: left; cursor: pointer; }
.th-fold:hover { color: var(--ink); }
.th-fold svg { flex: none; }
.th-fold .tw { display: inline-flex; color: var(--ink-3); }
.th.resolved .th-fold > svg { color: var(--fold); }
.th-note { padding: 6px 12px; font-size: 12.5px; color: var(--mark-ink); background: var(--mark); }
.th-new-h { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 8px 12px; font-size: 13px; border-bottom: 1px solid var(--line); }
.th-new-h svg { color: var(--gh-blue); }
.th-new-h .muted { font-size: 12px; }
.cm { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); }
.th > .cm:first-child, .th-fold + .cm, .th-note + .cm { border-top: 0; }
.av { width: 28px; height: 28px; border-radius: 50%; background: var(--surface-3); display: inline-block; flex: none; }
.cm-main { min-width: 0; display: grid; gap: 4px; }
.cm-h { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; font-size: 13px; color: var(--ink-3); }
.cm-who { color: var(--ink); font-weight: 600; text-decoration: none; }
.cm-who:hover { text-decoration: underline; }
.cm-h .sp { flex: 1; }
.cm-tag { font: 600 10px/1.5 var(--font-mono); text-transform: uppercase; letter-spacing: .04em; border: 1px solid var(--line-2); border-radius: 999px; padding: 0 7px; color: var(--ink-3); }
.cm-tag.pending { color: var(--mark-ink); border-color: var(--mark-strong); }
.cm-tools { display: inline-flex; gap: 2px; opacity: .65; }
.cm:hover .cm-tools, .cm-tools:focus-within { opacity: 1; }
.cm-tools .ib { width: 24px; height: 22px; }
.cm-rx { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.rx { appearance: none; border: 1px solid var(--line-2); border-radius: 999px; background: var(--surface); color: var(--ink-2); font: 500 12px/1.4 var(--font-body); padding: 1px 8px; cursor: pointer; }
.rx:hover { border-color: var(--ink-3); }
.rx.on { border-color: var(--gh-blue); background: var(--gh-blue-soft); color: var(--ink); }
.rx-pick { display: inline-flex; gap: 4px; padding: 2px 6px; border: 1px solid var(--line-2); border-radius: 999px; background: var(--surface-2); }
.rx-pick .rx { border-color: transparent; background: none; padding: 1px 4px; }
.rx-pick .rx.on { background: var(--gh-blue-soft); }
.th-f { display: grid; gap: 8px; padding: 8px 12px 10px; border-top: 1px solid var(--line); background: var(--surface-2); }
.th-reply { appearance: none; width: 100%; text-align: left; padding: 7px 10px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--surface); color: var(--ink-3); font: 400 13px/1.3 var(--font-body); cursor: text; }
.th-reply:hover { border-color: var(--ink-3); }
.th-acts { display: flex; gap: 8px; }
.cm-body { font: 400 14px/1.55 var(--font-body); color: var(--ink); overflow-wrap: anywhere; }
.cm-body > :first-child { margin-top: 0; }
.cm-body > :last-child { margin-bottom: 0; }
.cm-body p, .cm-body ul, .cm-body ol, .cm-body pre, .cm-body blockquote, .cm-body table, .cm-body details, .cm-body .highlight { margin: 0 0 10px; }
.cm-body ul, .cm-body ol { padding-left: 22px; }
.cm-body h1, .cm-body h2, .cm-body h3, .cm-body h4, .cm-body h5, .cm-body h6 { font-size: 15px; margin: 14px 0 8px; }
.cm-body a { color: var(--gh-blue); text-decoration: none; }
.cm-body a:hover { text-decoration: underline; }
.cm-body code { font: 12.5px var(--font-mono); background: var(--surface-3); padding: .15em .4em; border-radius: 5px; }
.cm-body pre { font: 12.5px/1.5 var(--font-mono); background: var(--paper); border: 1px solid var(--line); border-radius: 7px; padding: 10px 12px; overflow: auto; white-space: pre; }
.cm-body pre code { background: none; padding: 0; font-size: inherit; }
.cm-body blockquote { padding: 0 12px; border-left: 3px solid var(--line-2); color: var(--ink-2); }
.cm-body img { max-width: 100%; height: auto; }
.cm-body table { border-collapse: collapse; display: block; overflow: auto; }
.cm-body td, .cm-body th { border: 1px solid var(--line-2); padding: 5px 10px; }
.cm-body hr { border: 0; border-top: 1px solid var(--line-2); }
.cm-body .user-mention, .cm-body .team-mention { font-weight: 600; color: var(--ink); }
.cm-body .task-list-item { list-style: none; }
.cm-body .contains-task-list { padding-left: 6px; }
.cm-body input[type="checkbox"] { margin: 0 6px 0 0; vertical-align: middle; }
.cm-body summary { cursor: pointer; }
.cm-body .pl-k, .cm-body .pl-kos { color: var(--syn-kw); } .cm-body .pl-s, .cm-body .pl-pds { color: var(--syn-str); } .cm-body .pl-c { color: var(--syn-com); }
.cm-body .pl-en, .cm-body .pl-e { color: var(--syn-fn); } .cm-body .pl-c1, .cm-body .pl-sr { color: var(--syn-ty); } .cm-body .pl-smi, .cm-body .pl-v { color: var(--syn-id); } .cm-body .pl-ent { color: var(--add-ink); }
.cm-body .pl-mi1 { color: var(--add-ink); background: var(--add-bg); } .cm-body .pl-md { color: var(--del-ink); background: var(--del-bg); } .cm-body .pl-mdr, .cm-body .pl-mh { color: var(--ink-3); }
/* A suggested change, as GitHub renders it. */
.cm-body .js-suggested-changes-blob { border: 1px solid var(--line-2); border-radius: 7px; overflow: hidden; margin: 0 0 10px; }
.cm-body .js-suggested-changes-blob > div:first-child { padding: 5px 10px; font-size: 12px; color: var(--ink-3); border-bottom: 1px solid var(--line-2); background: var(--surface-2); }
.cm-body .js-suggested-changes-blob > div:nth-child(2) { overflow-x: auto; }
.cm-body .js-suggested-changes-blob table { display: table; width: 100%; border-collapse: collapse; font: 12.5px/1.55 var(--font-mono); margin: 0; }
.cm-body .js-suggested-changes-blob td { border: 0; padding: 0 8px; white-space: pre; }
.cm-body .blob-num { width: 1%; text-align: right; color: var(--ink-3); user-select: none; }
.cm-body .blob-num::before { content: attr(data-line-number); }
.cm-body .blob-num-deletion, .cm-body .blob-code-deletion { background: var(--del-bg); }
.cm-body .blob-num-addition, .cm-body .blob-code-addition { background: var(--add-bg); }
.cm-body .blob-code-marker-deletion::before { content: "−"; color: var(--del-ink); margin-right: 8px; }
.cm-body .blob-code-marker-addition::before { content: "+"; color: var(--add-ink); margin-right: 8px; }
.cmp { border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); overflow: hidden; }
.th.new .cmp { border: 0; border-radius: 0; }
.cmp-tabs { display: flex; align-items: flex-end; gap: 2px; padding: 6px 8px 0; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.cmp-tabs button:not(.ib) { appearance: none; border: 1px solid transparent; border-bottom: 0; background: none; color: var(--ink-3); padding: 6px 12px; border-radius: 6px 6px 0 0; font: 600 12.5px/1 var(--font-body); margin-bottom: -1px; cursor: pointer; }
.cmp-tabs button[aria-pressed="true"] { background: var(--paper); color: var(--ink); border-color: var(--line); }
.cmp-tabs .sp { flex: 1; }
.cmp-tabs .ib { margin-bottom: 4px; }
.cmp-ta { display: block; width: 100%; min-height: 84px; resize: vertical; border: 0; outline: none; background: var(--paper); color: var(--ink); font: 400 13px/1.5 var(--font-mono); padding: 10px 12px; }
.cmp-ta:focus { box-shadow: inset 0 0 0 1px var(--gh-blue); }
.cmp-pre { min-height: 84px; padding: 10px 12px; background: var(--paper); }
.cmp-f { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--line); background: var(--surface-2); }
.cmp-f .sp { flex: 1; }
.cmp-hint { font: 500 11.5px/1.3 var(--font-mono); color: var(--ink-3); }
.cmp-err { color: var(--del-ink); font: 500 13px/1.4 var(--font-body); padding: 6px 12px; }
.btn[aria-busy="true"] { opacity: .75; }
.btn:disabled { cursor: default; opacity: .55; }
.fthreads { padding: 8px 16px 2px; max-width: 900px; position: sticky; left: 0; }
.fthreads .th { position: static; width: auto; margin: 6px 0 10px; }
.th-away { appearance: none; display: inline-flex; align-items: center; gap: 6px; margin: 4px 0 6px; padding: 6px 10px; border: 1px dashed var(--line-2); border-radius: 8px; background: none; color: var(--ink-2); font: 500 13px/1.3 var(--font-body); cursor: pointer; }
.th-away .tw { display: inline-flex; color: var(--ink-3); }
.th-hunk { margin-top: 6px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px 8px 0 0; border-bottom: 0; background: var(--paper); font: 12px/1.5 var(--font-mono); white-space: pre; overflow-x: auto; color: var(--ink-2); }
.th-hunk + .th { margin-top: 0; border-top-left-radius: 0; border-top-right-radius: 0; }
.hh-cm, .cm-cnt { display: inline-flex; align-items: center; gap: 3px; color: var(--gh-blue); font: 600 11.5px/1 var(--font-mono); }
.cm-cnt { margin-right: 8px; }
.cm-cnt svg { width: 12px; height: 12px; }
.tabs.three { grid-template-columns: 1fr 1fr 1.3fr; }
.sb-gh { display: flex; align-items: center; gap: 6px; padding: 2px 8px 8px; font: 500 11.5px/1.4 var(--font-mono); color: var(--ink-3); }
.sb-gh .sp { flex: 1; }
.sb-warn { margin: 0 4px 8px; padding: 8px 10px; border-radius: 8px; background: var(--mark); color: var(--mark-ink); font: 500 12px/1.45 var(--font-body); }
.sb-pend { appearance: none; margin: 0 4px 8px; padding: 8px 10px; border: 1px solid var(--mark-strong); border-radius: 8px; background: var(--mark); color: var(--mark-ink); font: 600 12.5px/1.3 var(--font-body); text-align: left; cursor: pointer; }
.sb-row .tw { width: 12px; height: 16px; display: flex; align-items: center; justify-content: center; color: var(--ink-3); align-self: center; }
.sb-row.thr .st { border-radius: 50%; }
.sb-row.thr.done .st { background: var(--fold); border-color: var(--fold); }
.sb-row.thr.pend .st { background: var(--gh-blue-soft); border-color: var(--gh-blue); }
.sb-row.thr.away .st { background: none; border-style: dashed; }
.sb-row.thr .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-hbtn { appearance: none; border: 0; background: none; width: 100%; cursor: pointer; text-align: left; }
.sb-hbtn:hover { color: var(--ink-2); }
.conv { display: grid; gap: 12px; padding: 14px 16px 40px; max-width: 900px; position: sticky; left: 0; }
.conv > .cm { border: 1px solid var(--line-2); border-radius: 9px; background: var(--surface); }
.tl-ev { display: flex; align-items: center; gap: 8px; padding: 0 4px; font-size: 13px; color: var(--ink-2); }
.tl-ev .av { width: 20px; height: 20px; }
.tl-ev.ok::before, .tl-ev.no::before { content: ""; width: 8px; height: 8px; border-radius: 50%; flex: none; order: -1; }
.tl-ev.ok::before { background: var(--add-ink); } .tl-ev.no::before { background: var(--del-ink); }
.tl-body { margin-left: 28px; padding: 10px 12px; border: 1px solid var(--line-2); border-radius: 9px; }
.pr-state { font: 600 10.5px/1.6 var(--font-mono); text-transform: uppercase; letter-spacing: .05em; padding: 1px 8px; border-radius: 999px; color: #fff; background: #238636; }
.pr-state.merged { background: #8957E5; } .pr-state.closed { background: #DA3633; } .pr-state.draft { background: var(--surface-3); color: var(--ink-2); }
.vw-review { position: relative; }
.rv-btn .rv-n { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 999px; background: var(--paper); color: var(--ink); font: 600 11px/1.3 var(--font-mono); }
.rv-pop { position: absolute; right: 0; top: calc(100% + 8px); z-index: 40; width: min(480px, calc(100vw - 32px)); display: grid; gap: 10px; padding: 12px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; box-shadow: var(--shadow); }
.rv-h { display: flex; align-items: baseline; gap: 8px; font-size: 14px; }
.rv-opts { display: grid; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }
.rv-opt { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; cursor: pointer; }
.rv-opt > span { display: grid; gap: 1px; }
.rv-opt .muted { font-size: 12px; }
.rv-opt.off { opacity: .5; cursor: not-allowed; }
.toast { position: fixed; right: 16px; bottom: 40px; z-index: 50; padding: 8px 12px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface-3); color: var(--ink); font: 500 13px/1.3 var(--font-body); box-shadow: var(--shadow); opacity: 0; transform: translateY(6px); transition: opacity .2s, transform .2s; pointer-events: none; }
.toast.on { opacity: 1; transform: none; }

/* Suggestions for @ and # in comments. */
.mn-pop { position: fixed; z-index: 60; width: min(420px, calc(100vw - 16px)); max-height: 280px; overflow: hidden auto; padding: 4px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 9px; box-shadow: var(--shadow); display: grid; grid-template-columns: minmax(0, 1fr); }
.mn-pop[hidden] { display: none; }
.mn-it { appearance: none; display: flex; align-items: center; gap: 8px; width: 100%; min-width: 0; padding: 5px 8px; border: 0; border-radius: 6px; background: none; color: var(--ink); font: 400 13px/1.3 var(--font-body); text-align: left; cursor: pointer; }
.mn-it b { font-weight: 600; white-space: nowrap; }
.mn-it .muted { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mn-it.on, .mn-it:hover { background: var(--gh-blue-soft); }
.mn-it .av { width: 20px; height: 20px; }
.mn-ic { display: inline-flex; flex: none; color: var(--ink-3); }
.mn-ic.open { color: #3FB950; } .mn-ic.merged { color: #AB7DF8; } .mn-ic.closed { color: #F85149; } .mn-ic.draft { color: var(--ink-3); }
.mn-wait { padding: 6px 8px; font-size: 12.5px; color: var(--ink-3); }

/* Refreshing in place: a banner in the top bar. */
.vw-title .ib { width: 22px; height: 20px; align-self: center; }
.vw-fresh { display: flex; align-items: center; gap: 8px; padding: 4px 6px 4px 10px; border: 1px solid var(--mark-strong); border-radius: 8px; background: var(--mark); color: var(--mark-ink); font: 500 12.5px/1.3 var(--font-body); }
.vw-fresh[hidden] { display: none; }
.vw-fresh code { color: var(--ink); }
.spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* The status bar: the language server and the process's metrics. */
.vw-status { display: flex; justify-content: flex-end; align-items: center; gap: 10px; padding: 3px 12px; border-top: 1px solid var(--line); background: var(--surface-2); font: 500 11.5px/1.5 var(--font-mono); color: var(--ink-3); }
.vw-status[hidden] { display: none; }
.st-item { display: inline-flex; align-items: center; gap: 6px; position: relative; white-space: nowrap; }
.st-metrics { border: 1px solid var(--line-2); border-radius: 6px; padding: 0 8px; color: var(--ink-2); cursor: default; }
.st-metrics:focus-visible { outline-offset: 1px; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: var(--ink-3); flex: none; }
.dot.ready { background: var(--add-ink); }
.dot.starting { background: var(--mark-ink); animation: pulse 1.2s ease-in-out infinite; }
.dot.failed { background: var(--del-ink); }
@keyframes pulse { 50% { opacity: .3; } }
.st-pop { display: none; position: absolute; right: -1px; bottom: calc(100% + 9px); width: 270px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 9px; box-shadow: var(--shadow); padding: 10px 12px 11px; z-index: 30; white-space: normal; }
.st-metrics:hover .st-pop, .st-metrics:focus .st-pop { display: grid; gap: 7px; }
.st-pop-h { display: flex; justify-content: space-between; align-items: center; text-transform: uppercase; letter-spacing: .07em; font-size: 10.5px; color: var(--ink-2); margin-bottom: 3px; }
.st-badge { border: 1px solid var(--line-2); border-radius: 4px; padding: 1px 6px; font-size: 10px; color: var(--ink-3); }
.st-row { display: flex; justify-content: space-between; gap: 12px; }
.st-row b { color: var(--ink); font-weight: 600; }

/* The app: the viewer fills the window. */
html, body { height: 100%; margin: 0; }
body { overflow: hidden; }
.vw { height: 100vh; border: 0; border-radius: 0; box-shadow: none; grid-template-rows: auto minmax(0, 1fr) auto; }
.vw-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.vw-title a { color: var(--ink); text-decoration: none; }
.vw-title a:hover { text-decoration: underline; }
.vw-where { font: 500 12px/1.35 var(--font-mono); color: var(--ink-3); }
.vw.unsaved .vw-where::after { content: " · marks not saved: is untangle still running?"; color: var(--del-ink); }
@media (max-width: 960px) {
  body { overflow: auto; }
  .vw { height: auto; min-height: 100vh; }
}
/* The panes are as big as the window gives them: what changes in one never lays out the other. */
@media (min-width: 961px) {
  .vw-side, .vw-main { contain: strict; }
}
</style>
</head>
<body>
<div class="vw" id="viewer">
  <div class="vw-bar">
    <div class="vw-title" id="vw-title"></div>
    <div class="vw-fresh" id="vw-fresh" role="status" hidden></div>
    <label class="check"><input type="checkbox" id="vw-revdiff"> Diffs of reviewed code</label>
    <label class="vw-search"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11 L15 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><input id="vw-q" type="search" placeholder="Search changes" aria-label="Search changed lines" autocomplete="off"></label>
    <div class="vw-review" id="vw-review" hidden></div>
  </div>
  <div class="vw-body">
    <nav class="vw-side" id="vw-side" aria-label="Chains and files"></nav>
    <div class="vw-main" id="vw-main"><div class="empty">Loading the review…</div></div>
  </div>
  <div class="vw-status" id="vw-status" hidden>
    <span class="st-item" id="st-lsp" title="Dart analysis server"><i class="dot off"></i>LSP</span>
    <span class="st-item st-metrics" tabindex="0" aria-describedby="st-pop"><span data-m="summary">…</span>
      <span class="st-pop" id="st-pop" role="tooltip">
        <span class="st-pop-h"><b>Process metrics</b><span class="st-badge">untangle</span></span>
        <span class="st-row"><span>Resident RAM (RSS)</span><b data-m="rss">…</b></span>
        <span class="st-row"><span>CPU usage</span><b data-m="cpu">…</b></span>
        <span class="st-row"><span>Active resources</span><b data-m="resources">…</b></span>
        <span class="st-row"><span>Language server (RSS)</span><b data-m="lspRss">…</b></span>
        <span class="st-row"><span>Language server CPU</span><b data-m="lspCpu">…</b></span>
      </span>
    </span>
  </div>
</div>
